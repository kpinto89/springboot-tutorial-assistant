spring:
  application:
    name: springboot-tutorial-assistant

  ai:
    openai:
      api-key: ${GITHUB_TOKEN}   # GitHub token for the OpenAI-compatible models endpoint
      base-url: https://models.inference.ai.azure.com
      chat:
        completions-path: /chat/completions
        options:
          model: ${GITHUB_MODEL:gpt-4o-mini}
          max-tokens: 4096
          temperature: 0.7

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.demo: DEBUG
    org.springframework.ai: INFO
